name: Build and Release APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Optimized APKs
        # Uses --split-per-abi to significantly reduce APK size, obfuscates the code, and dynamically sets the production API base URL.
        # Note: Update 'https://api.ciro-production.com' below to your actual production backend URL.
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/app/outputs/symbols --dart-define=API_BASE_URL=https://ciro.pythonanywhere.com --dart-define=OPEN_WEATHER_API_KEY=${{ secrets.OPEN_WEATHER_API_KEY }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          # Upload all the small architecture-specific APKs instead of one massive fat APK
          files: build/app/outputs/flutter-apk/app-*-release.apk
          generate_release_notes: true
